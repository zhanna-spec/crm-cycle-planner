# Deploys the planner-proxy Edge Function to Supabase whenever its code changes.
# One-time setup: add a repository secret named SUPABASE_ACCESS_TOKEN
# (Settings -> Secrets and variables -> Actions -> New repository secret).
name: Deploy Supabase function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-function.yml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: armhnzdunwrgactgdlbc
    steps:
      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add a repository secret named SUPABASE_ACCESS_TOKEN (Settings > Secrets and variables > Actions), then run this workflow again."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy planner-proxy
        run: supabase functions deploy planner-proxy --project-ref "$PROJECT_REF"
