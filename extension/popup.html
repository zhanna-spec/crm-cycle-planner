<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan this site</title>
<style>
  :root { --bg: #F1F0FB; --surface: #FFFFFF; --sunk: #EFEDFC; --ink: #1E1B3A; --muted: #6E6A8F; --accent: #6A5AE0; --accent-soft: #E8E5FD; --coral: #E5566F; --coral-soft: #FFE5EA; --mint: #18936F; --mint-soft: #DBF5EC; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14112B; --surface: #201B44; --sunk: #2A2455; --ink: #F2F0FF; --muted: #A9A4CF; --accent: #9184F5; --accent-soft: #2F2868; --coral: #FF8FA2; --coral-soft: #4A2237; --mint: #5ED6AE; --mint-soft: #173E36; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; width: 380px; background: var(--bg); color: var(--ink); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { background: var(--accent); color: #FFFFFF; padding: 14px 16px; }
  header b { font-size: 15px; display: block; }
  header span { opacity: .85; font-size: 12px; word-break: break-all; }
  main { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .list { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow-y: auto; }
  .item { display: flex; gap: 6px; align-items: flex-start; background: var(--surface); border-radius: 10px; padding: 7px 9px; }
  .item label { display: flex; gap: 8px; align-items: flex-start; flex: 1; min-width: 0; cursor: pointer; }
  .item .x { padding: 2px 7px; font-size: 11px; border-radius: 7px; flex: none; }
  .grp { font-size: 11px; font-weight: 600; color: var(--accent); margin: 6px 2px 0; }
  details summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 12px; }
  .col { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
  input[type=text] { padding: 7px 9px; border-radius: 8px; border: 0; background: var(--surface); color: var(--ink); font: inherit; }
  .item input { margin-top: 2px; accent-color: var(--accent); }
  .item b { font-weight: 600; }
  .item small { display: block; color: var(--muted); word-break: break-all; font-size: 11px; }
  .cat { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
  .seg { display: flex; gap: 4px; background: var(--sunk); border-radius: 10px; padding: 3px; }
  .seg label { flex: 1; text-align: center; }
  .seg input { position: absolute; opacity: 0; }
  .seg span { display: block; padding: 6px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500; }
  .seg input:checked + span { background: var(--accent); color: #FFFFFF; }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; }
  input[type=url] { flex: 1; min-width: 0; padding: 7px 9px; border-radius: 8px; border: 0; background: var(--surface); color: var(--ink); font: inherit; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 9px 12px; cursor: pointer; background: var(--sunk); color: var(--accent); }
  button.primary { background: var(--accent); color: #FFFFFF; width: 100%; padding: 11px; }
  button.quiet { background: transparent; color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { color: var(--muted); font-size: 12px; margin: 0; }
  .warn { background: var(--coral-soft); color: var(--coral); border-radius: 10px; padding: 8px 10px; margin: 0; }
  .ok { background: var(--mint-soft); color: var(--mint); border-radius: 10px; padding: 8px 10px; margin: 0; }
  .bar { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  select { padding: 6px 8px; border-radius: 8px; border: 0; background: var(--surface); color: var(--ink); font: inherit; }
</style>
</head>
<body>
  <header><b>Scan this site</b><span id="site">Looking at this page…</span></header>
  <main id="main"></main>
  <script src="popup.js"></script>
</body>
</html>
